# Conda environment that produced every file in results/.
#   mamba env create -f env/environment.yml
#   mamba activate plume
#   pip install --no-deps -e .
name: plume
channels:
  - conda-forge
dependencies:
  - python=3.12.14
  - numpy=2.5.3
  - scipy=1.18.1
  - matplotlib=3.11.1
  - pandas=3.0.5
  - xarray=2026.7.0
  - netcdf4=1.7.4
  - jax=0.10.2
  - jaxlib=0.10.2
  - numpyro=0.21.0
  - arviz=1.3.0
  - dynesty=3.1.0
  - gsw=3.6.23
  - xlrd=2.0.2
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - pytest=9.1.1
  - ruff=0.16.7
  - pip
